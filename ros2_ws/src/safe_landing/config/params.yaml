# Parameters of the safe_landing node. The launch file adds world,
# mission_x / mission_y and log_dir on top of these.
safe_landing:
  ros__parameters:
    auto_takeoff: true            # sim: the node arms and takes off. Real drone: false, pilot hands over in OFFBOARD
    use_mission_point: true       # false = land near wherever the drone is when it starts
    look_altitude_m: 10.0         # wide camera: ~25 x 14 m of ground at ~1.9 cm/px
    feel_start_agl_m: 5.0         # rangefinder check starts here
    final_agl_m: 1.5              # below this, land if the check passed
    land_commit_agl_m: 0.7        # until this low, someone walking in still aborts the landing
    descent_speed_fast: 1.0       # m/s above feel_start
    descent_speed_slow: 0.4       # m/s during the check
    yaw_rate_deg_s: 45.0          # turning while descending draws the spiral
    max_attempts: 3               # go-arounds before RTL
    max_looks: 8
    final_hold_timeout_s: 10.0
    required_radius_m: 1.0        # FR-06 landing circle radius
    clearance_credit_m: 3.0       # prefer spots with up to this much open ground around them (keeps away from walls)
    max_slope_deg: 10.0           # FR-04
    bump_threshold_m: 0.12        # rocks / holes bigger than this abort the landing
    feel_check_radius_m: 1.3
    feel_min_points: 80
    moving_buffer_m: 1.5          # FR-05 buffer around the landing circle
    static_margin_m: 0.5          # "moving" things this close to a roof, tree or rock seen at confirm are parallax
    slope_block_radius_m: 4.0     # after a slope abort, avoid this radius around the spot
    look_edge_threshold: 6.0
    look_bad_cell_fraction: 0.10
    # Camera (must match sim/models/x500_landing/model.sdf, or your real camera)
    camera_width: 1280
    camera_height: 720
    camera_hfov_deg: 102.0        # Pi Camera Module 3 Wide
    camera_offset: [0.05, 0.0, -0.06]
    camera_timeout_s: 5.0         # no frame for this long = camera failed (slow sims lag)
    # Rangefinders (body frame FLU, metres)
    range_down_offset: [-0.03, 0.0, -0.06]
    range_tilt_offset: [0.0, 0.0, -0.06]
    range_tilt_deg: 15.0
    range_timeout_s: 0.5
